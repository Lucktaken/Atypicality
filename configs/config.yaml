# Atypicality 项目配置文件
# 所有路径均不硬编码，统一在此配置

paths:
  # NAS 挂载路径（存放 100G+ 原始数据）
  nas_mount: "/mnt/nas/atypicality/raw/"

  # 本地原始数据路径
  raw_data_local: "data/raw/"
  raw_sciscinet: "data/raw/sciscinet/"
  raw_datacite: "data/raw/datacite/"

  # 中表与派生数据路径（统一扁平化到 data/interim/）
  interim_data: "data/interim/"
  interim_authors_info: "data/interim/authors_info.csv"
  interim_core_table: "data/interim/authors_with_c3_c5_avg.csv"
  interim_paper_atypicality: "data/interim/paper_level_data_atypicality.csv"
  interim_embeddings: "data/interim/papers_with_embeddings.csv"
  interim_paper_level_regression_ready: "data/interim/paper_level_regression_ready.csv"
  interim_paper_level_first_author_ready: "data/interim/paper_level_first_author_ready.csv"
  interim_atypicality_authorlevel_withCountry: "data/interim/atypicality_authorlevel_withCountry.csv"
  interim_author_data_usage_stats: "data/interim/author_data_usage_stats.csv"
  interim_retention_authorlevel: "data/interim/retention_authorlevel.csv"

  # 研究问题输出根路径
  studies_output: "studies/"

interim_table:
  filename: "authors_with_c3_c5_avg.csv"
  chunk_size: 100000

api:
  openalex_base_url: "https://api.openalex.org/works/doi:"
  openalex_email: "xuyifei@umich.edu"

visualization:
  font_family: "sans-serif"
  font_sans:
    - "Times New Roman"
    - "Helvetica"
    - "Arial"
  pdf_fonttype: 42
  fs_title: 24
  fs_label: 20
  fs_ticks: 18
  fs_legend: 18

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"